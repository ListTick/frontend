server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
      proxy_pass http://listtick:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /realms/ {
      proxy_pass http://localhost:8090;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /resources/ {
      proxy_pass http://localhost:8090;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
}